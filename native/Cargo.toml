[package]
name = "veacom-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
dicom-core = "0.10.1"
dicom-dictionary-std = "0.10.1"
dicom-object = { version = "0.10.1", features = ["deflate"] }
dicom-parser = "0.10.1"
dicom-encoding = "0.10.1"
# Without the default features, which bring rayon for the engine's own threads to do (src/parallel.rs).
dicom-transfer-syntax-registry = { version = "0.10.1", default-features = false, features = ["charls", "native", "deflate"] }
flate2 = "1"
getrandom = "0.4"
dicom-pixeldata = { version = "0.10.1", default-features = false, features = ["native", "openjpeg-sys", "charls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1
