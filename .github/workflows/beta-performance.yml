name: Beta performance comparison

on: workflow_dispatch

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    environment: bench-beta1-main-af4ca4f
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and verify the exact beta 1 source
        env:
          ARCHIVE: ${{ secrets.BETA1_ARCHIVE }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/beta1"
          mkdir "$base"
          curl --silent --show-error --fail --retry 2 "$ARCHIVE" -o "$RUNNER_TEMP/beta1.tgz"
          tar -xzf "$RUNNER_TEMP/beta1.tgz" --strip-components=1 -C "$base"
          rm "$RUNNER_TEMP/beta1.tgz"
          git -C "$base" init --quiet
          git -C "$base" add --force .
          test "$(git -C "$base" write-tree)" = 30d258d5984637384d8ac7d7c8e6145d7164cd67
          git worktree add --detach "$RUNNER_TEMP/merged-main" af4ca4ff44080dcc5ab4b4d13818acaf069dfce5
          echo "BASE_APP=$base" >> "$GITHUB_ENV"
          echo "HEAD_APP=$RUNNER_TEMP/merged-main" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/merged-main/node_modules" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prepare Linux desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg dcmtk libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libnotify4 libsecret-1-0 libgl1-mesa-dri libegl1 libegl-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "VEACOM_SOFTWARE_GL=llvmpipe" >> "$GITHUB_ENV"
      - name: Prepare Mac video verification
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v dcmcjpeg >/dev/null || brew install dcmtk
      - name: Build the two pinned releases separately with their own lockfiles and Electron
        run: |
          set -euo pipefail
          for app_root in "$BASE_APP" "$HEAD_APP"; do
            (
              cd "$app_root"
              pnpm install --frozen-lockfile > "$RUNNER_TEMP/installation.log" 2>&1 || { tail -12 "$RUNNER_TEMP/installation.log"; exit 1; }
              pnpm run setup:runtime
              pnpm run build:web > "$RUNNER_TEMP/web-build.log" 2>&1
              cargo build --release --locked --manifest-path native/Cargo.toml > "$RUNNER_TEMP/native-build.log" 2>&1
              test -x native/target/release/veacom-core
            )
          done
          if cmp -s "$BASE_APP/native/target/release/veacom-core" "$HEAD_APP/native/target/release/veacom-core"; then exit 1; fi
      - name: Compare nine paired Auto Window trials at identical window and level
        env:
          VEACOM_MATCH_MPR: "1"
        run: node tools/check-beta-performance.cjs "$RUNNER_TEMP/beta-desktop" 9
      - name: Keep timings, pixel checks and sample counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta1-main-mpr-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/open-speed/open-speed.json
            ${{ runner.temp }}/open-speed/open-speed.md
            ${{ runner.temp }}/beta-desktop/desktop.json
            ${{ runner.temp }}/beta-desktop/desktop.md
          retention-days: 30
