name: Measure the three-plane CT transition
on:
  workflow_dispatch:
    inputs:
      reference:
        description: Reference viewer commit
        type: string
        default: '845bc2c8da40ea1e6d7f580695179ff05e5efb62'
      candidate:
        description: Candidate viewer commit
        type: string
        default: 'd0f6941af6ada8c81d4dbd0003b1b9118b431ecd'
      rounds:
        description: Pairs per command timing scenario
        type: choice
        default: '8'
        options: ['4', '8', '12']
      exercise:
        description: Measure opening the three planes or scrolling within them
        type: choice
        default: transition
        options: [transition, paging, patient-space, visible-paging]
      captured_run:
        description: Encode the captures already produced by this run
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  mpr:
    if: inputs.captured_run == ''
    runs-on: macos-15
    timeout-minutes: 50
    env:
      # An optimised engine without the release build's link-time optimisation (see the engine job). Release builds
      # package the release profile as Cargo.toml sets it.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> native/target
      - name: Check out public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.reference }}
          path: reference-build
          persist-credentials: false
      - name: Check out the candidate renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate-build
          persist-credentials: false
      - name: Build the candidate UI against the identical engine
        run: |
          diff -qr -x target reference-build/native candidate-build/native
          cd reference-build
          pnpm install --frozen-lockfile
          pnpm run setup:runtime
          pnpm run build:core
          pnpm run build:web
          core="$PWD/native/target/release/veacom-core"
          echo "VEACOM_CORE_PATH=$core" >> "$GITHUB_ENV"
          echo "REFERENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cd ../candidate-build
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile
          pnpm run build:web
      - name: Generate the reference CT and record the machine
        env:
          EXERCISE: ${{ inputs.exercise }}
        run: |
          mkdir -p "$RUNNER_TEMP/mpr"
          sysctl -n machdep.cpu.brand_string > "$RUNNER_TEMP/mpr/cpu.txt"
          system_profiler SPDisplaysDataType -json > "$RUNNER_TEMP/mpr/display.json"
          if [ "$EXERCISE" = patient-space ]; then
            node tools/reading-audit/coordinate-study.mjs "$RUNNER_TEMP/coordinate-study" "$RUNNER_TEMP/mpr"
          elif [ "$EXERCISE" = paging ] || [ "$EXERCISE" = visible-paging ]; then
            node tools/reading-audit/plane-study.mjs "$RUNNER_TEMP/plane-study" "$RUNNER_TEMP/mpr/study-manifest.json"
          else
            cd reference-build
            node --input-type=module -e "import {makeStudy} from './tools/browser-bench/make-study.mjs'; await makeStudy('ct-1000');"
            cp "$HOME/.cache/veacom-bench/studies/ct-1000/manifest.json" "$RUNNER_TEMP/mpr/study-manifest.json"
          fi
      - name: Compare after scrolling and at full-volume readiness
        if: inputs.exercise == 'transition'
        env:
          PAIRS: ${{ inputs.rounds }}
        run: node tools/reading-audit/reading.cjs "$PWD/reference-build" "$RUNNER_TEMP" "$RUNNER_TEMP/mpr" "$HOME/.cache/veacom-bench/studies" "$PAIRS" "$PWD/candidate-build"
      - name: Check real scrolling within each reconstruction against independent reference images
        if: inputs.exercise == 'paging'
        env:
          PAIRS: ${{ inputs.rounds }}
        run: node tools/reading-audit/plane-paging.cjs "$PWD/reference-build" "$RUNNER_TEMP" "$RUNNER_TEMP/mpr" "$RUNNER_TEMP/plane-study" "$PAIRS" "$PWD/candidate-build"
      - name: Read known patient coordinates in axial and reordered acquisitions
        if: inputs.exercise == 'patient-space'
        run: node tools/reading-audit/patient-space-frames.cjs "$PWD/reference-build" "$RUNNER_TEMP" "$RUNNER_TEMP/mpr" "$RUNNER_TEMP/coordinate-study" "$PWD/candidate-build"
      - name: Time wheel input to the correct composited CT reconstruction
        if: inputs.exercise == 'visible-paging'
        env:
          PAIRS: ${{ inputs.rounds }}
        run: node tools/reading-audit/visible-paging.cjs "$PWD/reference-build" "$RUNNER_TEMP" "$RUNNER_TEMP/mpr" "$RUNNER_TEMP/plane-study" "$PAIRS" "$PWD/candidate-build"
      - name: Keep measurements and partial results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mpr-comparison
          path: ${{ runner.temp }}/mpr
          retention-days: 14
  recording:
    needs: mpr
    if: always() && inputs.exercise == 'transition' && (needs.mpr.result == 'success' || inputs.captured_run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mpr-comparison
          path: ${{ runner.temp }}/mpr
          run-id: ${{ inputs.captured_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Encode the original timed screen captures
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 tools/reading-audit/recording.py "$RUNNER_TEMP/mpr"
          for build in reference candidate; do
            ffprobe -v error -show_entries stream=codec_name,width,height,duration "$RUNNER_TEMP/mpr/$build.mp4"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mpr-comparison-with-video
          path: ${{ runner.temp }}/mpr
          retention-days: 30
