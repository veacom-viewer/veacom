name: Repeat the original patient switch checks before collecting diagnostics
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: released, run: '45819275843' }
          - { case: patient, run: '45819478935' }
          - { case: pair, run: '45831724023' }
          - { case: integrated, run: '45850314137' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: viewer-site-${{ matrix.run || github.run_id }}
          run-id: ${{ matrix.run || github.run_id }}
          github-token: ${{ github.token }}
          path: web/site/public
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Retain the unmodified bitmap before examining later frames
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          for i in 1 2 3 4 5 6 7 8; do
            rc=0
            VEACOM_SWITCH_OUT="$RUNNER_TEMP/images/trial-$i" node web/tools/browser-check.mjs > "$RUNNER_TEMP/images/trial-$i.log" 2>&1 || rc=$?
            echo "$rc" > "$RUNNER_TEMP/images/trial-$i.exit"
            test -f "$RUNNER_TEMP/images/trial-$i/threaded/capture.json"
            test -f "$RUNNER_TEMP/images/trial-$i/single/capture.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: switch-images-${{ matrix.case }}
          path: ${{ runner.temp }}/images
          retention-days: 14
