name: Replay an exported MP4 at verified presentation timestamps
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  decode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45853479297
          name: macos-smoke-45853479297
          path: input-film
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:runtime
      - name: Configure Electron's sandbox helper on the hosted Linux machine
        run: |
          helper=$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Replay the known film, fresh exports and a real black first frame
        run: node tools/replay-video-presentations.cjs input-film/video-encoder/video.mp4 "$RUNNER_TEMP/video-replay"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: video-replay-${{ matrix.os }}
          path: ${{ runner.temp }}/video-replay
          retention-days: 14
