name: Check middle and superior MR references against the normal viewer
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: old-forced, run: '45850314137', ref: '958de8d7febc9eacbc187caec5313d4b9a05772e', force: 'yes', expected: 'fail' }
          - { case: fixed-forced, run: '45850314137', ref: '6b781c82bc657b4b3b6b582480c2ef6073d2c50e', force: 'yes', expected: 'pass' }
          - { case: fixed-natural, run: '45850314137', ref: '6b781c82bc657b4b3b6b582480c2ef6073d2c50e', force: 'no', expected: 'pass' }
          - { case: released, run: '45819275843', ref: '6b781c82bc657b4b3b6b582480c2ef6073d2c50e', force: 'no', expected: 'fail' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: viewer-site-${{ matrix.run || github.run_id }}
          run-id: ${{ matrix.run || github.run_id }}
          github-token: ${{ github.token }}
          path: web/site/public
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Capture the ordinary check and its two real source-frame controls
        shell: bash
        env:
          CHECK_REVISION: ${{ matrix.ref }}
          FORCE_PREVIEW: ${{ matrix.force }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          node tools/make-preview-check.mjs "$CHECK_REVISION"
          mkdir -p "$RUNNER_TEMP/images"
          for i in 1 2 3 4; do
            rc=0
            VEACOM_SWITCH_OUT="$RUNNER_TEMP/images/trial-$i" node web/tools/reference-preview-check.mjs > "$RUNNER_TEMP/images/trial-$i.log" 2>&1 || rc=$?
            echo "$rc" > "$RUNNER_TEMP/images/trial-$i.exit"
            test -f "$RUNNER_TEMP/images/trial-$i/threaded/trace.json"
            test -f "$RUNNER_TEMP/images/trial-$i/single/trace.json"
            if [ "$EXPECTED" = pass ]; then test "$rc" = 0; else test "$rc" != 0; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: switch-images-${{ matrix.case }}
          path: ${{ runner.temp }}/images
          retention-days: 14
