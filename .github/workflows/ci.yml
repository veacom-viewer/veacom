name: Replay an exported MP4 at verified presentation timestamps
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  decode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read the exact archive from the first failed Mac job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          from hashlib import sha256
          from io import BytesIO
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile
          archive = subprocess.check_output(['gh', 'api', 'repos/veacom-viewer/veacom/actions/artifacts/15135331233/zip'])
          assert sha256(archive).hexdigest() == '355efc2fb1ac3121b09188b76f10ef345cdce7980feaeb5d4ac278bc13cd1219'
          target = Path('input-film/video-encoder/video.mp4')
          target.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(BytesIO(archive)) as movie:
              target.write_bytes(movie.read('video-encoder/video.mp4'))
          PYTHON
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:runtime
      - name: Configure Electron's sandbox helper on the hosted Linux machine
        if: runner.os == 'Linux'
        run: |
          helper=$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Replay the known film, fresh exports and a real black first frame
        run: node tools/replay-video-presentations.cjs input-film/video-encoder/video.mp4 "$RUNNER_TEMP/video-replay"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: video-replay-${{ matrix.os }}
          path: ${{ runner.temp }}/video-replay
          retention-days: 14
