name: Capture previous cine controls
on: workflow_dispatch
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VEACOM_SOFTWARE_GL: llvmpipe # electron/main.cjs: lets a development run use llvmpipe for WebGL
      # An optimised engine without the release build's link-time optimisation (see the engine job).
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> native/target
          # One cache for the three shards, which build the same engine; one of them saves it.
          shared-key: desktop
          save-if: 'false'
      - name: Desktop libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libnotify4 libsecret-1-0 \
            libgl1-mesa-dri libegl1 libegl-mesa0
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses. Allow them on this
          # throwaway runner instead of turning the sandbox off.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          {
            echo 'DISPLAY=:99'
            echo "EVIDENCE=$RUNNER_TEMP/desktop-evidence"
            echo "STUDY=$RUNNER_TEMP/smoke-study"
          } >> "$GITHUB_ENV"
      - name: Build
        id: build
        run: |
          pnpm install --frozen-lockfile
          pnpm run setup:runtime
          pnpm run build:core
          pnpm run build:web

      - run: node tools/fixtures/make-cine-study.mjs "$STUDY"
      - run: node tools/capture-cine-reference.mjs "$STUDY" "$EVIDENCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cine-reference
          path: ${{ env.EVIDENCE }}
          retention-days: 7
