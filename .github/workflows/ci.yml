name: Measure the three-plane CT transition
on: workflow_dispatch
permissions:
  contents: read
jobs:
  mpr:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      # An optimised engine without the release build's link-time optimisation (see the engine job). Release builds
      # package the release profile as Cargo.toml sets it.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> native/target
      - name: Check out public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c2e542d4c49f8c95de1a3ca87fa1c164785e27f8
          path: reference-build
          persist-credentials: false
      - name: Check out the candidate renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e5e88edba0dc6237407556dd52d2c30fa0b40b85
          path: candidate-build
          persist-credentials: false
      - name: Build the candidate UI against the identical engine
        run: |
          diff -qr -x target reference-build/native candidate-build/native
          cd reference-build
          pnpm install --frozen-lockfile
          pnpm run setup:runtime
          pnpm run build:core
          pnpm run build:web
          core="$PWD/native/target/release/veacom-core"
          echo "VEACOM_CORE_PATH=$core" >> "$GITHUB_ENV"
          echo "REFERENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cd ../candidate-build
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile
          pnpm run build:web
      - name: Generate the reference CT and record the machine
        run: |
          mkdir -p "$RUNNER_TEMP/mpr"
          sysctl -n machdep.cpu.brand_string > "$RUNNER_TEMP/mpr/cpu.txt"
          system_profiler SPDisplaysDataType -json > "$RUNNER_TEMP/mpr/display.json"
          cd reference-build
          node --input-type=module -e "import {makeStudy} from './tools/browser-bench/make-study.mjs'; await makeStudy('ct-1000');"
          cp "$HOME/.cache/veacom-bench/studies/ct-1000/manifest.json" "$RUNNER_TEMP/mpr/study-manifest.json"
      - name: Compare eight pairs and keep one real screen capture sequence per build
        run: node tools/reading-audit/reading.cjs "$PWD/reference-build" "$RUNNER_TEMP" "$RUNNER_TEMP/mpr" "$HOME/.cache/veacom-bench/studies" 8 "$PWD/candidate-build"
      - name: Encode the recorded frames at their original capture times
        run: python3 tools/reading-audit/recording.py "$RUNNER_TEMP/mpr"
      - name: Keep measurements and partial results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mpr-comparison
          path: ${{ runner.temp }}/mpr
          retention-days: 14
