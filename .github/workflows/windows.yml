name: Windows
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45899430958
          name: viewer-site-45899430958
          path: sites/old
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45902567521
          name: viewer-site-45902567521
          path: sites/released
      - run: pnpm install --frozen-lockfile
      - run: node tools/check-released-scouts.mjs
      - run: |
          node tools/check-six-cut-output.mjs corrected
          git restore --source=6b306e12 src/ui/deformityReport.ts
          node tools/check-six-cut-output.mjs previous
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reading-evidence-${{ github.run_id }}
          path: evidence
