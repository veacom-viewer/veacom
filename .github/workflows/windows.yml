name: Windows viewer interaction
on:
  workflow_dispatch:
    inputs:
      reference:
        required: true
        type: string
      candidate:
        required: true
        type: string
      pairs:
        required: true
        type: string
        default: '5'
permissions:
  contents: read
jobs:
  viewer:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: native
          shared-key: windows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.reference }}
          path: reference-app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate-app
          persist-credentials: false
      - name: Build the two desktop apps with the same engine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tree=git rev-parse HEAD:native
          if ((git -C reference-app rev-parse HEAD:native) -ne $tree -or (git -C candidate-app rev-parse HEAD:native) -ne $tree) { throw 'Different native source trees' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run setup:runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run build:core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach($app in @('reference-app','candidate-app')) {
            pnpm --dir $app install --frozen-lockfile
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            pnpm --dir $app run build:web
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          "VEACOM_CORE_PATH=$PWD/native/target/release/veacom-core.exe" >> $env:GITHUB_ENV
      - name: Make the synthetic mammogram and 25 identifiable CT slices
        run: node tools/warp-reading/fixtures.mjs "$env:RUNNER_TEMP/warp-studies" "$env:RUNNER_TEMP/warp-reading"
      - name: Time real window drags and 25-pane resizes
        env:
          VEACOM_WARP_PAIRS: ${{ inputs.pairs }}
        run: node tools/warp-reading/reading.cjs reference-app candidate-app "$env:RUNNER_TEMP/warp-studies" "$env:RUNNER_TEMP/warp-reading"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-reading
          path: ${{ runner.temp }}/warp-reading
          retention-days: 21
