name: Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  trace-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm run setup:runtime
      - name: Probe both startup orders with the pinned Electron
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir trace-proof
          for mode in trace-first blank-first; do
            code=0
            timeout -k 3 20 xvfb-run -a pnpm exec electron tools/browser-bench/trace-blank-probe.cjs "$mode" > "trace-proof/$mode.txt" 2>&1 || code=$?
            echo "$code" >> "trace-proof/$mode.txt"
            cat "trace-proof/$mode.txt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trace-start-evidence
          path: trace-proof
