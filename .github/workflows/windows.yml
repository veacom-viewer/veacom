name: Windows redraw comparison
on:
  workflow_dispatch:
    inputs:
      reference:
        description: Reference renderer commit
        required: true
        type: string
      candidate:
        description: Candidate renderer commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  redraw:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.reference }}
          path: reference-renderer
          sparse-checkout: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate-renderer
          sparse-checkout: src
          persist-credentials: false
      - name: Compare window, pan and combined redraws on the same two WARP cores
        run: node tools/profile-display-sampling.mjs reference-renderer candidate-renderer "$env:RUNNER_TEMP/redraw/result.json" --warp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: redraw-measurements
          path: ${{ runner.temp }}/redraw
          retention-days: 21
