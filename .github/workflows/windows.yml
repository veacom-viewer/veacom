name: Windows
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  noise:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45902567521
          name: viewer-site-45902567521
          path: sites/previous
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45908098503
          name: viewer-site-45908098503
          path: sites/released
      - name: Check both site builds against the published-file hashes
        run: |
          python3 - <<'PYTHON'
          from hashlib import sha256
          from pathlib import Path
          import json
          expected = {'previous': '98998df1d74fe36f16cd0526721d97f8651427b998882bc6d9c931693c2a0987', 'released': 'f5968a16dd9f930c3b4dc59da837c19348b205e157ce9c94872cfa21beea1078'}
          receipt = {}
          for role, digest in expected.items():
              root = Path('sites')/role
              files = {p.relative_to(root).as_posix(): sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
              total = sha256(''.join(k+' '+v+'\n' for k,v in sorted(files.items())).encode()).hexdigest()
              assert len(files) == 61 and total == digest, (role, len(files), total)
              receipt[role] = {'files': len(files), 'manifestSha256': total}
          Path('evidence').mkdir()
          Path('evidence/sites.json').write_text(json.dumps(receipt, indent=2))
          PYTHON
      - run: node tools/browser-bench/measure-noise-display.mjs sites evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acquired-ct-noise-${{ github.run_id }}
          path: evidence
