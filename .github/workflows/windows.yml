name: Windows
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  reading:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 45902094084
          name: viewer-site-45902094084
          path: web/site/public
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          mkdir -p "$RUNNER_TEMP/images"
          for i in $(seq 1 4); do
            rc=0
            VEACOM_SWITCH_OUT="$RUNNER_TEMP/images/trial-$i" node web/tools/browser-check.mjs > "$RUNNER_TEMP/images/trial-$i.log" 2>&1 || rc=$?
            echo "$rc" > "$RUNNER_TEMP/images/trial-$i.exit"
            if ((rc)); then tail -12 "$RUNNER_TEMP/images/trial-$i.log"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: normal-mr-${{ matrix.trial }}
          path: ${{ runner.temp }}/images
