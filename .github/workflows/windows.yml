name: Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  touch:
    strategy:
      fail-fast: false
      matrix:
        viewer: [sequence, fresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> native/target
          shared-key: desktop
          save-if: false
      - run: pnpm install --frozen-lockfile
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libnotify4 libsecret-1-0 libgl1-mesa-dri libegl1 libegl-mesa0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pnpm run setup:runtime
          pnpm run build:core
          pnpm run build:web
      - run: xvfb-run -a -s '-screen 0 1920x1080x24' node tools/measure-mpr-suite.mjs
        env:
          VEACOM_SOFTWARE_GL: llvmpipe
          VEACOM_HARNESS_ELECTRON: '1'
          VEACOM_SKIP_GPU_CHECKS: '1'
          TOUCH_CASE: ${{ matrix.viewer }}
