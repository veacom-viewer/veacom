name: Windows browser adapter check
on:
  workflow_dispatch:
    inputs:
      site_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.site_run }}
          name: viewer-site-${{ inputs.site_run }}
          path: web/site/public
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - shell: pwsh
        run: node web/tools/browser-check.mjs warp "$env:RUNNER_TEMP\browser-first-frame"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-first-frame-adapter
          path: ${{ runner.temp }}/browser-first-frame
