name: Profile constrained Windows redraw
on: workflow_dispatch
permissions:
  contents: read
jobs:
  redraw:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; reads packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packaging/pnpm-lock.yaml
      - name: Record the machine
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          "EVIDENCE=$evidence" >> $env:GITHUB_ENV
          "STUDY=$(Join-Path $env:RUNNER_TEMP 'smoke-study')" >> $env:GITHUB_ENV
          $os = Get-CimInstance Win32_OperatingSystem
          $lines = @("commit ${{ github.event.pull_request.head.sha || github.sha }} (tested as ${{ github.sha }})", "$($os.Caption) $($os.Version)", "node $(node --version)")
          $lines += @(Get-CimInstance Win32_VideoController | ForEach-Object { "display $($_.Name), driver $($_.DriverVersion), $($_.CurrentHorizontalResolution)x$($_.CurrentVerticalResolution)" })
          $lines | Tee-Object (Join-Path $evidence 'machine.txt')

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Desktop runtimes
        id: runtime
        run: pnpm run setup:runtime
      - name: Get the reference renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ac84997d4c3883ffb09b5054513f8a87b9235bc5
          path: sampling-reference
          sparse-checkout: src
          persist-credentials: false
      - name: Compare display frame times on WARP
        run: node tools/profile-display-sampling.mjs sampling-reference "$env:EVIDENCE\display-sampling.json" --warp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: warp-redraw
          path: ${{ runner.temp }}/evidence
          retention-days: 14
