name: Windows
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: released
            run: '45902567521'
          - name: corrected
            run: '45902093763'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: viewer-site-${{ matrix.run }}
          path: web/site/public
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          mkdir -p evidence
          rc=0
          node web/tools/browser-check.mjs > evidence/browser.log 2>&1 || rc=$?
          tail -8 evidence/browser.log
          echo "$rc" > evidence/exit.txt
          if [[ "$KIND" == corrected ]]; then
            test "$rc" -eq 0 && test ! -d "$VEACOM_SWITCH_EVIDENCE"
          else
            test "$rc" -ne 0
            for mode in single threaded; do
              for file in reference.png first.png reference.json first.json; do
                test -s "$VEACOM_SWITCH_EVIDENCE/$mode/MR/$file"
              done
            done
          fi
        env:
          KIND: ${{ matrix.name }}
          VEACOM_SWITCH_EVIDENCE: ${{ github.workspace }}/evidence/mismatch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: saved-switch-${{ matrix.name }}
          path: evidence
