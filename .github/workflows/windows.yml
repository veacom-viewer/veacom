name: Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  touch:
    strategy:
      fail-fast: false
      matrix:
        viewer: [before, after]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.viewer == 'before'
        run: git restore --source=f15407cf285fec4cbf9b2db4eb134669eb14ca85 src/components/Viewport.tsx
      - run: node tools/measure-mpr-touch.mjs
