name: Verify the published Windows install command
on: workflow_dispatch
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 62b224de3241adfa31fa84501ea476ed2ac0400d
          persist-credentials: false
      - name: Install and uninstall the published binary on the disposable runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $scriptUrl = 'https://raw.githubusercontent.com/veacom-viewer/veacom/v0.1.0-beta.2/scripts/install.ps1'
          $scriptText = irm $scriptUrl
          $localText = [IO.File]::ReadAllText((Resolve-Path 'scripts/install.ps1').Path)
          if ($scriptText -isnot [string] -or $scriptText.Replace("`r`n","`n") -cne $localText.Replace("`r`n","`n")) { throw 'Public script differs from the release tag.' }
          $script:installed = $false
          function Start-Process([string]$FilePath, [switch]$PassThru, [switch]$Wait) {
            if (!$PassThru -or !$Wait -or [IO.Path]::GetFileName($FilePath) -cne 'VEAcom-Electron-0.1.0-beta.2-win-x64-Installer.exe') { throw 'Unexpected installer launch.' }
            if ((Get-FileHash -LiteralPath $FilePath -Algorithm SHA256).Hash -ine 'a0409d00f3c01f45cae9ea0dd5661888b793a6709cd836f79d2bcb2d93d39349') { throw 'Downloaded the wrong binary.' }
            if ((Get-Content -LiteralPath $FilePath -Stream Zone.Identifier -Raw) -notmatch 'ZoneId=3') { throw 'Missing downloaded-file marker.' }
            $proc = Microsoft.PowerShell.Management\Start-Process -FilePath $FilePath -ArgumentList '/S' -PassThru -Wait
            if ($proc.ExitCode -eq 0) { $script:installed = $true }
            return $proc
          }
          $scriptText | iex
          if (!$script:installed) { throw 'The published installer did not run.' }
          Remove-Item Function:\Start-Process
          $records = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'VEAcom Electron*' })
          if ($records.Count -ne 1 -or $records[0].DisplayVersion -ne '0.1.0-beta.2') { throw 'Installed version does not match the beta.' }
          $folder = $records[0].InstallLocation
          if (!$folder) { $folder = Join-Path $env:LOCALAPPDATA 'Programs\VEAcom Electron' }
          $folder = $folder.Trim('"').TrimEnd('\')
          if (!(Test-Path -LiteralPath (Join-Path $folder 'VEAcom Electron.exe')) -or !(Test-Path -LiteralPath (Join-Path $folder 'resources\native\veacom-core.exe'))) { throw 'The installed viewer or engine is missing.' }
          Write-Host 'PASS public PowerShell bootstrap installed VEAcom 0.1.0-beta.2.'
          & tools/check-windows-package.ps1 -Action Uninstall -Output "$env:RUNNER_TEMP\live-uninstall"
