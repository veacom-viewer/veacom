name: Windows
on:
  workflow_dispatch:
    inputs:
      entry_sha:
        description: SHA-256 of the tested main browser entry
        required: true
        type: string
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the deployed browser entry
        env:
          EXPECTED: ${{ inputs.entry_sha }}
        run: |
          mkdir -p evidence
          python3 - <<'PYTHON'
          import hashlib,json,os,re
          from urllib.request import urlopen
          from urllib.parse import urljoin
          site='https://viewer.veacom.app/'
          with urlopen(site,timeout=30) as r: html=r.read().decode()
          matches=re.findall(r'<script[^>]+src="([^"]+)"',html)
          entries=[s for s in matches if '/web-' in s]
          assert len(entries)==1
          url=urljoin(site,entries[0])
          with urlopen(url,timeout=45) as r: digest=hashlib.sha256(r.read()).hexdigest()
          assert re.fullmatch('[0-9a-f]{64}',os.environ['EXPECTED']) and digest==os.environ['EXPECTED'],(url,digest)
          open('evidence/site.json','w').write(json.dumps({'url':url,'sha256':digest,'scripts':matches},indent=2))
          PYTHON
      - run: node tools/browser-bench/patient-switch-frames.mjs live evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-patients-${{ github.run_id }}
          path: evidence
