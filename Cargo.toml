[workspace]
members = ["native", "web/engine"]
default-members = ["native"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
dicom-pixeldata = { version = "0.10.1", default-features = false, features = ["native"] }
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.browser-release]
inherits = "release"
lto = true
